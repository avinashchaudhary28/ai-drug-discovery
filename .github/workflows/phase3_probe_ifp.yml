name: Phase 3 - IFP probe (ek baar ka)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe
        run: |
          set -o pipefail
          python -u experiments/phase3/probe_ifp.py 2>&1 | tee ifp.log
      - name: Summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -120 ifp.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Nateeja commit karo
        if: always()
        run: |
          mkdir -p experiments/phase3/results
          cp ifp.log experiments/phase3/results/probe_ifp.log || true
          bash .github/commit_results.sh "${{ github.ref_name }}" \
            "phase3: IFP probe (run ${{ github.run_number }})" \
            experiments/phase3/results/probe_ifp.log

name: Phase 2 - ChEMBL mutation data harvest

on:
  workflow_dispatch:
    inputs:
      data_version:
        description: "Cache ki chaabi. Query badle to ise badlo, warna purana download wapas aayega."
        required: false
        default: "v1"
      fresh:
        description: "true = cache ignore karke sab dobara download"
        required: false
        default: "false"
      drop_mut:
        description: "true = sirf mutation wala download dobara (WT cache bacha rahega)"
        required: false
        default: "false"
      drop_wt_targets:
        description: "Comma se alag target ids, jinka WT data dobara utarna hai (jaise CHEMBL2041)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: phase2-harvest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q "numpy<2.3" pandas tabulate

      # Pehle ye. Lamba download shuru karke baad me "parser galat tha"
      # pata chalna sabse mehnga hai.
      - name: Selftest (bina network)
        run: python -u experiments/phase2/selftest.py

      # restore aur save alag-alag hain, jaan-boojh kar. actions/cache
      # sirf job SAFAL hone pe save karta hai - yaani timeout ya error pe
      # ghanton ka download zaaya. Niche 'always()' wala save step wahi
      # bachata hai, aur script target-wise resume kar leti hai.
      - name: Cache restore (download kiya hua data)
        id: cache
        if: inputs.fresh != 'true'
        uses: actions/cache/restore@v4
        with:
          path: experiments/phase2/work
          key: phase2-chembl-${{ inputs.data_version }}-${{ github.run_number }}
          restore-keys: |
            phase2-chembl-${{ inputs.data_version }}-

      # Poora dobara download 5 ghante ka hai. Jo hissa adhoora raha tha
      # sirf wahi girana sasta padta hai - baaki cache bacha rehta hai.
      - name: Cache ka adhoora hissa girao
        if: inputs.drop_mut == 'true' || inputs.drop_wt_targets != ''
        env:
          DROP_MUT: ${{ inputs.drop_mut }}
          DROP_WT: ${{ inputs.drop_wt_targets }}
        run: |
          set -euo pipefail
          python -u - <<'PY'
          import json, os, pathlib
          work = pathlib.Path("experiments/phase2/work")
          if os.environ.get("DROP_MUT") == "true":
              for f in ("variant_activities.jsonl", "variant.done"):
                  p = work / f
                  if p.exists():
                      p.unlink()
                      print(f"giraya: {f}")
          drop = [t.strip() for t in os.environ.get("DROP_WT", "").split(",")
                  if t.strip()]
          if drop:
              dp = work / "wt_done.json"
              done = set(json.loads(dp.read_text())) if dp.exists() else set()
              jl = work / "wt_activities.jsonl"
              rows = ([json.loads(l) for l in jl.read_text().splitlines()
                       if l.strip()] if jl.exists() else [])
              kept = [r for r in rows if r.get("target_chembl_id") not in drop]
              jl.write_text("".join(json.dumps(r) + "\n" for r in kept))
              dp.write_text(json.dumps(sorted(done - set(drop))))
              print(f"WT se hataye {len(rows) - len(kept)} rows, "
                    f"targets dobara utrenge: {drop}")
          PY

      - name: Harvest
        run: |
          set -o pipefail
          python -u experiments/phase2/harvest_chembl.py 2>&1 | tee harvest.log

      - name: Cache save (run fail ho ya na ho)
        if: always() && inputs.fresh != 'true'
        uses: actions/cache/save@v4
        with:
          path: experiments/phase2/work
          key: phase2-chembl-${{ inputs.data_version }}-${{ github.run_number }}

      - name: Summary
        if: always()
        run: |
          echo "### Phase 2 - ChEMBL mutation harvest" >> $GITHUB_STEP_SUMMARY
          if [ -f experiments/phase2/results/RESULT.md ]; then
            cat experiments/phase2/results/RESULT.md >> $GITHUB_STEP_SUMMARY
          else
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -60 harvest.log >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Nateeja repo me commit karo
        if: always()
        run: |
          mkdir -p experiments/phase2/results
          tail -c 200000 harvest.log > experiments/phase2/results/run.log || true
          bash .github/commit_results.sh "${{ github.ref_name }}" \
            "phase2: ChEMBL mutation harvest (run ${{ github.run_number }})" \
            experiments/phase2/results

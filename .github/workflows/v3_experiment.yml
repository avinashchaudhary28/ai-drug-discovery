name: v3 BindingDB experiment

on:
  workflow_dispatch:
    inputs:
      max_total_pairs:
        description: "Total training pairs ki upper limit (memory)"
        required: false
        default: "120000"
      n_trees:
        description: "XGBoost trees (kam = tez)"
        required: false
        default: "400"
      n_seeds:
        description: "Kitne seeds pe dohraana hai"
        required: false
        default: "5"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Machine kitni badi hai
        run: |
          echo "CPUs: $(nproc)"
          free -g
          df -h /

      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q \
            "numpy<2.3" pandas scipy scikit-learn tabulate \
            rdkit xgboost
          # transformers ko torch >= 2.6 chahiye, isliye version pin nahi karte
          python -m pip install -q "torch>=2.6" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q transformers
          python -c "import numpy,pandas,scipy,sklearn,rdkit,xgboost,torch,transformers as t;print('numpy',numpy.__version__);print('rdkit',rdkit.__version__);print('xgboost',xgboost.__version__);print('torch',torch.__version__);print('transformers',t.__version__)"

      - name: Downloaded data cache
        uses: actions/cache@v4
        with:
          path: experiments/v3_bindingdb/work
          key: v3-work-${{ hashFiles('experiments/v3_bindingdb/run_v3.py') }}
          restore-keys: |
            v3-work-

      - name: Experiment chalao
        env:
          MAX_TOTAL_PAIRS: ${{ inputs.max_total_pairs }}
          N_TREES: ${{ inputs.n_trees }}
          N_SEEDS: ${{ inputs.n_seeds }}
          BUDGET_MIN: "300"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          set -o pipefail
          python -u experiments/v3_bindingdb/run_v3.py 2>&1 | tee run.log

      - name: Nateeja dikhao
        if: always()
        run: |
          echo "### v3 experiment" >> $GITHUB_STEP_SUMMARY
          if [ -f experiments/v3_bindingdb/results/RESULT.md ]; then
            cat experiments/v3_bindingdb/results/RESULT.md >> $GITHUB_STEP_SUMMARY
          else
            echo "RESULT.md nahi bana - log dekho" >> $GITHUB_STEP_SUMMARY
            tail -60 run.log >> $GITHUB_STEP_SUMMARY || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-results
          path: |
            experiments/v3_bindingdb/results/
            run.log
          if-no-files-found: warn

      # Artifacts/logs blob storage pe rehte hain jo har jagah se nahi khulte.
      # Isliye nateeja aur log repo me hi commit kar dete hain.
      - name: Nateeja repo me commit karo
        if: always()
        run: |
          mkdir -p experiments/v3_bindingdb/results
          tail -c 200000 run.log > experiments/v3_bindingdb/results/run.log || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f experiments/v3_bindingdb/results/
          if git diff --cached --quiet; then
            echo "kuch naya nahi"
          else
            git commit -m "v3 experiment result (run ${{ github.run_number }})"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

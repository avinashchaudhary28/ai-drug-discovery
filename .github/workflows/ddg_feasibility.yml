name: ddG feasibility (Davis mutation data ki ginti)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ddg-feasibility

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q "numpy<2.3" pandas
          python -c "import numpy,pandas;print('numpy',numpy.__version__,'pandas',pandas.__version__)"

      - name: Ginti karo
        run: |
          set -o pipefail
          python -u experiments/mutants/ddg_feasibility.py 2>&1 | tee ddg.log

      - name: Summary
        if: always()
        run: |
          echo '### ddG feasibility' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -60 ddg.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Commit
        if: always()
        run: |
          mkdir -p experiments/mutants/results
          tail -c 200000 ddg.log > experiments/mutants/results/ddg_run.log || true
          bash .github/commit_results.sh "${{ github.ref_name }}" \
            "ddG feasibility (run ${{ github.run_number }})" \
            experiments/mutants/results

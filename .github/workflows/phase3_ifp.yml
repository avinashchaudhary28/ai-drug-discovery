name: Phase 3 - IFP arm (dawa yahan lagti hai ya nahi)

on:
  workflow_dispatch:
    inputs:
      min_pairs:
        description: "LOGO fold ke liye kam se kam jode"
        required: false
        default: "20"
      seeds:
        description: "Seeds, comma se"
        required: false
        default: "0,1,2"

permissions:
  contents: write

concurrency:
  group: phase3-ifp
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q "numpy<2.3" pandas scipy scikit-learn rdkit xgboost tabulate

      # Pehle ye. IFP ke bits galat position se padh liye jayein to
      # feature chup-chaap jhootha ho jayega aur error kabhi nahi aayega.
      - name: Selftest (IFP padhna aur jodna)
        run: python -u experiments/phase3/selftest_ifp.py

      - name: Selftest (batwara aur farsh)
        run: python -u experiments/phase3/selftest_logo.py

      - name: Zaroori input maujood hai?
        run: |
          set -e
          for f in experiments/phase2/results/mutation_ddg_merged.csv \
                   experiments/phase3/results/klifs_map.json; do
            test -s "$f" || { echo "::error::$f nahi mila"; exit 1; }
            echo "✓ $f"
          done

      - name: Cache (KLIFS ke jawab)
        uses: actions/cache@v4
        with:
          path: experiments/phase3/work_klifs
          key: phase3-klifs-v2-${{ github.run_number }}
          restore-keys: |
            phase3-klifs-v2-
            phase3-klifs-v1-

      - name: IFP arm
        env:
          MIN_PAIRS: ${{ inputs.min_pairs }}
          SEEDS: ${{ inputs.seeds }}
        run: |
          set -o pipefail
          python -u experiments/phase3/run_ifp.py 2>&1 | tee ifp_run.log

      - name: Summary
        if: always()
        run: |
          echo "### Phase 3 - IFP arm" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -70 ifp_run.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Nateeja commit karo
        if: always()
        run: |
          mkdir -p experiments/phase3/results
          tail -c 200000 ifp_run.log > experiments/phase3/results/ifp_run.log || true
          bash .github/commit_results.sh "${{ github.ref_name }}" \
            "phase3: IFP arm (run ${{ github.run_number }})" \
            experiments/phase3/results

name: Phase 3 - few-shot (k maap dekar)

on:
  workflow_dispatch:
    inputs:
      ks:
        description: "k ki list, comma se"
        required: false
        default: "0,5,10,20,50"
      seeds:
        description: "Seeds, comma se"
        required: false
        default: "0,1,2"
      test_frac:
        description: "Test ka hissa (0.5 ya 0.33). Ghatane pe genes badhte hain"
        required: false
        default: "0.5"
      tag:
        description: "Output files ka suffix, jaise _k20. Khali = purana naam"
        required: false
        default: ""
      objective:
        description: "reg:absoluteerror (gate MAE naapta hai) ya reg:squarederror"
        required: false
        default: "reg:absoluteerror"
      gate_model:
        description: "Gate kis model pe - NUMBER DEKHNE SE PEHLE tay karo"
        required: false
        default: "XGB (+shots, cal)"

permissions:
  contents: write

concurrency:
  group: phase3-fewshot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q "numpy<2.3" pandas scipy scikit-learn rdkit xgboost tabulate

      # Pehle ye. Do cheezein galat hon to curve jhootha hoga aur koi
      # error nahi aayega: shots aur test ka saajha hona, aur test set
      # ka k ke saath badal jana.
      - name: Selftest (few-shot batwara)
        run: python -u experiments/phase3/selftest_fewshot.py

      - name: Selftest (batwara aur farsh)
        run: python -u experiments/phase3/selftest_logo.py

      # Poora raasta nakli xgboost/features se - index, dict lookup,
      # column ka naam, gate ka lookup. Ye bugs warna 25 minute baad
      # milte hain.
      - name: Dry run (nakli model, poora raasta)
        run: python -u experiments/phase3/dryrun_fewshot.py

      - name: Zaroori input maujood hai?
        run: |
          set -e
          f=experiments/phase2/results/mutation_ddg_merged.csv
          test -s "$f" || { echo "::error::$f nahi mila"; exit 1; }
          echo "✓ $f"

      - name: Few-shot curve
        env:
          KS: ${{ inputs.ks }}
          SEEDS: ${{ inputs.seeds }}
          TEST_FRAC: ${{ inputs.test_frac }}
          TAG: ${{ inputs.tag }}
          OBJECTIVE: ${{ inputs.objective }}
          GATE_MODEL: ${{ inputs.gate_model }}
        run: |
          set -o pipefail
          python -u experiments/phase3/run_fewshot.py 2>&1 | tee fewshot.log

      - name: Summary
        if: always()
        run: |
          echo "### Phase 3 - few-shot" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -70 fewshot.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Nateeja commit karo
        if: always()
        run: |
          mkdir -p experiments/phase3/results
          tail -c 200000 fewshot.log \
            > "experiments/phase3/results/fewshot_run${{ inputs.tag }}.log" || true
          bash .github/commit_results.sh "${{ github.ref_name }}" \
            "phase3: few-shot curve${{ inputs.tag }} (run ${{ github.run_number }})" \
            experiments/phase3/results

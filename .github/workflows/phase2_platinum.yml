name: Phase 2 - Platinum ddG harvest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q "numpy<2.3" pandas tabulate

      # Pehle test. ddG ka sign ulta ho jaye to resistance sudhaar jaisa
      # dikhega, aur wo galti kabhi error nahi deti.
      - name: Selftest (ddG ka hisaab aur sign)
        run: python -u experiments/phase2/selftest_platinum.py

      - name: Harvest
        run: |
          set -o pipefail
          python -u experiments/phase2/harvest_platinum.py 2>&1 | tee plat.log

      - name: Summary
        if: always()
        run: |
          echo "### Phase 2 - Platinum" >> $GITHUB_STEP_SUMMARY
          if [ -f experiments/phase2/results/RESULT.md ]; then
            cat experiments/phase2/results/RESULT.md >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -70 plat.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Nateeja commit karo
        if: always()
        run: |
          mkdir -p experiments/phase2/results
          cp plat.log experiments/phase2/results/platinum_run.log || true
          bash .github/commit_results.sh "${{ github.ref_name }}" \
            "phase2: Platinum ddG harvest (run ${{ github.run_number }})" \
            experiments/phase2/results

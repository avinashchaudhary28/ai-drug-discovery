name: Phase 3 - LOGO baseline (farsh)

on:
  workflow_dispatch:
    inputs:
      min_pairs:
        description: "Gene pe kam se kam itne jode (warna test bemaani)"
        required: false
        default: "20"
      n_trees:
        description: "XGBoost trees"
        required: false
        default: "400"
      seeds:
        description: "Seeds, comma se"
        required: false
        default: "0,1,2"

permissions:
  contents: write

concurrency:
  group: phase3-baseline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q "numpy<2.3" pandas scipy scikit-learn rdkit xgboost tabulate
          python -c "
          import xgboost as xgb, numpy as np
          from rdkit import Chem
          m = xgb.XGBRegressor(n_estimators=5, tree_method='hist')
          m.fit(np.random.rand(20, 4), np.random.rand(20))
          print('xgboost + rdkit ok')"

      # Pehle ye. Is phase ki sabse khatarnak galti LEAK hai: held-out
      # gene training me chala jaye, ya baseline ka ausat poore data se
      # bane. Dono me nateeja shandaar dikhega aur jhooth hoga.
      - name: Selftest (batwara aur farsh - LEAK ki jaanch)
        run: python -u experiments/phase3/selftest_logo.py

      - name: Zaroori input maujood hai?
        run: |
          set -e
          f=experiments/phase2/results/mutation_ddg_merged.csv
          test -s "$f" || { echo "::error::$f nahi mila"; exit 1; }
          echo "✓ $f ($(wc -l < "$f") lines)"

      - name: Baseline
        env:
          MIN_PAIRS: ${{ inputs.min_pairs }}
          N_TREES: ${{ inputs.n_trees }}
          SEEDS: ${{ inputs.seeds }}
        run: |
          set -o pipefail
          python -u experiments/phase3/run_baseline.py 2>&1 | tee base.log

      - name: Summary
        if: always()
        run: |
          echo "### Phase 3 - LOGO baseline" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -70 base.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Nateeja repo me commit karo
        if: always()
        run: |
          mkdir -p experiments/phase3/results
          tail -c 200000 base.log > experiments/phase3/results/run.log || true
          bash .github/commit_results.sh "${{ github.ref_name }}" \
            "phase3: LOGO baseline (run ${{ github.run_number }})" \
            experiments/phase3/results

name: Phase 3 - KLIFS probe (ek baar ka)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe (daur 1 - spec aur kinase)
        run: |
          set -o pipefail
          python -u experiments/phase3/probe_klifs.py 2>&1 | tee klifs.log

      - name: Probe (daur 2 - pocket position se residue number)
        run: |
          set -o pipefail
          python -u experiments/phase3/probe_klifs2.py 2>&1 | tee -a klifs.log
      - name: Summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -150 klifs.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Nateeja commit karo
        if: always()
        run: |
          mkdir -p experiments/phase3/results
          cp klifs.log experiments/phase3/results/probe_klifs.log || true
          bash .github/commit_results.sh "${{ github.ref_name }}" \
            "phase3: KLIFS probe (run ${{ github.run_number }})" \
            experiments/phase3/results/probe_klifs.log
